[project]
name = "cert-prep-backend"
version = "0.1.0-alpha.1"
description = "Local sidecar API for the cert prep desktop app."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "av>=18.0.0,<19.0.0",
  "capture-runtime-client==0.7.2",
  "cert-prep-contracts",
  "cert-prep-ollama",
  "fastapi>=0.124.0,<1.0.0",
  "ollama>=0.6.0,<1.0.0",
  "pillow>=12.0.0,<13.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pypdfium2>=5.0.0,<6.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sudachidict-core==20261015",
  "sudachipy>=0.7,<0.8",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[tool.uv.sources]
cert-prep-contracts = { path = "../../packages/cert-prep-contracts", editable = true }
cert-prep-ollama = { path = "../../packages/cert-prep-ollama", editable = true }

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "import-linter>=2.1,<3",
  "pyinstaller>=6.19.0,<7.0.0",
  "pytest>=9.1.0,<10.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "scripts", "."]
testpaths = ["tests"]
# Remove tmp_path directories after every session; tests must not leave temp files.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py314"

# Architecture rules (DDD refactor step C1, .agents/PLANS/ddd-refactor/). The rules
# describe the target dependency direction on today's packages; imports that break them
# today are listed under ignore_imports as known exceptions, and each later step may
# only shorten those lists.
[tool.importlinter]
root_package = "cert_prep_backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Platform does not depend on contexts or the web layer"
type = "forbidden"
source_modules = ["cert_prep_backend.platform"]
forbidden_modules = [
  "cert_prep_backend.projects",
  "cert_prep_backend.ai_providers",
  "cert_prep_backend.practice",
  "cert_prep_backend.source_library",
  "cert_prep_backend.authoring",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
  "cert_prep_backend.api",
  "cert_prep_backend.routers",
]

[[tool.importlinter.contracts]]
name = "Contexts do not depend on the web layer"
type = "forbidden"
# Each context keeps its endpoints in <context>.api; its other layers stay free of the web.
source_modules = [
  "cert_prep_backend.projects.infrastructure",
  "cert_prep_backend.practice.domain",
  "cert_prep_backend.practice.application",
  "cert_prep_backend.practice.infrastructure",
  "cert_prep_backend.source_library.domain",
  "cert_prep_backend.source_library.infrastructure",
  "cert_prep_backend.authoring.domain",
  "cert_prep_backend.authoring.infrastructure",
  "cert_prep_backend.capture_integration.application",
  "cert_prep_backend.capture_integration.infrastructure",
  "cert_prep_backend.runtime_provisioning.domain",
  "cert_prep_backend.runtime_provisioning.application",
  "cert_prep_backend.runtime_provisioning.infrastructure",
  "cert_prep_backend.authoring.application",
  "cert_prep_backend.ai_providers.domain",
  "cert_prep_backend.ai_providers.application",
  "cert_prep_backend.ai_providers.infrastructure",
]
forbidden_modules = [
  "cert_prep_backend.api",
  "cert_prep_backend.routers",
  "fastapi",
  "starlette",
]

[[tool.importlinter.contracts]]
name = "Domain models and policies stay free of frameworks and I/O"
type = "forbidden"
source_modules = [
  "cert_prep_backend.projects.domain",
  "cert_prep_backend.authoring.domain",
  "cert_prep_backend.source_library.domain",
  "cert_prep_backend.practice.domain",
  "cert_prep_backend.capture_integration.domain",
  "cert_prep_backend.ai_providers.domain",
  "cert_prep_backend.runtime_provisioning.domain",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic",
  "httpx",
  "ollama",
  "capture_runtime_client",
  "cert_prep_backend.platform.database",
  "cert_prep_backend.platform.change_notifications",
  "cert_prep_backend.platform.sse",
  "cert_prep_backend.api",
  "cert_prep_backend.routers",
]

# D8: Capture Integration is the anticorruption layer for Capture Runtime. The SDK's types
# stay in its infrastructure and in the router's response models.
[[tool.importlinter.contracts]]
name = "Capture Integration's use cases do not name Capture SDK types"
type = "forbidden"
source_modules = ["cert_prep_backend.capture_integration.application"]
forbidden_modules = ["capture_runtime_client"]

[[tool.importlinter.contracts]]
name = "Study Projects does not depend on other contexts"
type = "forbidden"
source_modules = ["cert_prep_backend.projects"]
forbidden_modules = [
  "cert_prep_backend.ai_providers",
  "cert_prep_backend.source_library",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.authoring",
  "cert_prep_backend.practice",
  "cert_prep_backend.runtime_provisioning",
]

[[tool.importlinter.contracts]]
name = "Source Library does not depend on its downstream contexts"
type = "forbidden"
source_modules = ["cert_prep_backend.source_library"]
forbidden_modules = [
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.authoring",
  "cert_prep_backend.practice",
  "cert_prep_backend.runtime_provisioning",
]

[[tool.importlinter.contracts]]
name = "Question Authoring does not depend on its downstream contexts"
type = "forbidden"
source_modules = ["cert_prep_backend.authoring"]
forbidden_modules = [
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.practice",
  "cert_prep_backend.runtime_provisioning",
]

[[tool.importlinter.contracts]]
name = "AI Providers does not depend on other contexts"
type = "forbidden"
# AI Providers is upstream of every context that calls a language model (D13).
source_modules = ["cert_prep_backend.ai_providers"]
forbidden_modules = [
  "cert_prep_backend.projects",
  "cert_prep_backend.source_library",
  "cert_prep_backend.authoring",
  "cert_prep_backend.practice",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
]

[[tool.importlinter.contracts]]
name = "Capture Integration, Practice and Runtime Provisioning do not depend on each other"
type = "independence"
modules = [
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.practice",
  "cert_prep_backend.runtime_provisioning",
]
# Known until the routers take their providers from the contexts that own them (C4, C6):
# they read them from api.dependencies, which imports every context.
ignore_imports = [
  "cert_prep_backend.capture_integration.api.router -> cert_prep_backend.api.dependencies",
  "cert_prep_backend.capture_integration.api.router -> cert_prep_backend.routers.documents",
  "cert_prep_backend.practice.api.router -> cert_prep_backend.api.dependencies",
]

[[tool.importlinter.contracts]]
name = "Each context layers api and infrastructure over application over domain"
type = "layers"
# D2: only layers with code exist, so each layer is optional; api and infrastructure do not
# import each other.
containers = [
  "cert_prep_backend.projects",
  "cert_prep_backend.ai_providers",
  "cert_prep_backend.practice",
  "cert_prep_backend.source_library",
  "cert_prep_backend.authoring",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
]
layers = ["(api) | (infrastructure)", "(application)", "(domain)"]
# The capture workbench router still reads host models, the runtime policy, and an
# upload helper of routers.documents. The runtime router still returns RuntimeReady.
ignore_imports = [
  "cert_prep_backend.capture_integration.api.router -> cert_prep_backend.api.dependencies",
  "cert_prep_backend.capture_integration.api.router -> cert_prep_backend.capture_integration.infrastructure.host_models",
  "cert_prep_backend.capture_integration.api.router -> cert_prep_backend.capture_integration.infrastructure.runtime_policy",
  "cert_prep_backend.capture_integration.api.router -> cert_prep_backend.routers.documents",
  "cert_prep_backend.capture_integration.api.runtime_router -> cert_prep_backend.capture_integration.infrastructure.host_models",
]

[[tool.importlinter.contracts]]
name = "Other contexts reach Study Projects only through its application and domain"
type = "forbidden"
source_modules = [
  "cert_prep_backend.practice",
  "cert_prep_backend.source_library",
  "cert_prep_backend.authoring",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
  "cert_prep_backend.routers",
]
forbidden_modules = [
  "cert_prep_backend.projects.infrastructure",
  "cert_prep_backend.projects.api",
]
# Known before each context's C4 gives its code a project lookup instead of a database:
# they check that a project exists through ensure_project_exists(db, project_id).
ignore_imports = [
  "cert_prep_backend.authoring.infrastructure.draft_jobs -> cert_prep_backend.projects.infrastructure.repository",
  "cert_prep_backend.authoring.infrastructure.manual_operations -> cert_prep_backend.projects.infrastructure.repository",
  "cert_prep_backend.authoring.infrastructure.repository -> cert_prep_backend.projects.infrastructure.repository",
  "cert_prep_backend.routers.documents -> cert_prep_backend.projects.infrastructure.repository",
]

[[tool.importlinter.contracts]]
name = "Other contexts reach Practice and Review only through its application and domain"
type = "forbidden"
source_modules = [
  "cert_prep_backend.projects",
  "cert_prep_backend.source_library",
  "cert_prep_backend.authoring",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
  "cert_prep_backend.routers",
]
forbidden_modules = [
  "cert_prep_backend.practice.infrastructure",
  "cert_prep_backend.practice.api",
]

[[tool.importlinter.contracts]]
name = "Other contexts reach Source Library only through its application and domain"
type = "forbidden"
source_modules = [
  "cert_prep_backend.projects",
  "cert_prep_backend.practice",
  "cert_prep_backend.authoring",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
  "cert_prep_backend.routers",
]
forbidden_modules = [
  "cert_prep_backend.source_library.infrastructure",
  "cert_prep_backend.source_library.api",
]
# Known until Question Authoring and Capture Integration get their own C4, and until C6 moves
# routers.documents (still Source Library's HTTP layer) and the capture rules out of the
# routers: they call Source Library's storage functions directly.
ignore_imports = [
  "cert_prep_backend.authoring.infrastructure.sources -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.authoring.infrastructure.draft_jobs -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.authoring.infrastructure.manual_operations -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.authoring.infrastructure.repository -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.authoring.infrastructure.streaming -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.capture_integration.infrastructure.persistence -> cert_prep_backend.source_library.infrastructure.operations",
  "cert_prep_backend.capture_integration.infrastructure.review_workflow -> cert_prep_backend.source_library.infrastructure.operations",
  "cert_prep_backend.capture_integration.infrastructure.review_workflow -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.routers.documents -> cert_prep_backend.source_library.api.markdown",
  "cert_prep_backend.routers.documents -> cert_prep_backend.source_library.api.schemas",
  "cert_prep_backend.routers.documents -> cert_prep_backend.source_library.infrastructure.operations",
  "cert_prep_backend.routers.documents -> cert_prep_backend.source_library.infrastructure.repository",
  "cert_prep_backend.routers.documents -> cert_prep_backend.source_library.infrastructure.source_preparation",
  "cert_prep_backend.routers.documents -> cert_prep_backend.source_library.infrastructure.storage",
  "cert_prep_backend.routers.operation_events -> cert_prep_backend.source_library.infrastructure.operations",
  "cert_prep_backend.routers.operation_events -> cert_prep_backend.source_library.infrastructure.repository",
]

[[tool.importlinter.contracts]]
name = "Other contexts reach AI Providers only through its application and domain"
type = "forbidden"
source_modules = [
  "cert_prep_backend.projects",
  "cert_prep_backend.practice",
  "cert_prep_backend.source_library",
  "cert_prep_backend.authoring",
  "cert_prep_backend.capture_integration",
  "cert_prep_backend.runtime_provisioning",
  "cert_prep_backend.routers",
]
forbidden_modules = [
  "cert_prep_backend.ai_providers.infrastructure",
  "cert_prep_backend.ai_providers.api",
]
# Runtime Provisioning shows AI Providers' machine inventory under /runtime with AI Providers'
# DTO. The route stays in the runtime router so the API keeps its operation order (D6, D15).
ignore_imports = [
  "cert_prep_backend.runtime_provisioning.api.router -> cert_prep_backend.ai_providers.api.schemas",
]
