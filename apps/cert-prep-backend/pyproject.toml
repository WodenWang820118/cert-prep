[project]
name = "cert-prep-backend"
version = "0.1.0-alpha.1"
description = "Local sidecar API for the cert prep desktop app."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "av>=18.0.0,<19.0.0",
  "capture-runtime-client==0.7.2",
  "cert-prep-contracts",
  "cert-prep-ollama",
  "fastapi>=0.124.0,<1.0.0",
  "ollama>=0.6.0,<1.0.0",
  "pillow>=12.0.0,<13.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pypdfium2>=5.0.0,<6.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[tool.uv.sources]
cert-prep-contracts = { path = "../../packages/cert-prep-contracts", editable = true }
cert-prep-ollama = { path = "../../packages/cert-prep-ollama", editable = true }

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "import-linter>=2.1,<3",
  "pyinstaller>=6.19.0,<7.0.0",
  "pytest>=9.1.0,<10.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "scripts", "."]
testpaths = ["tests"]
# Remove tmp_path directories after every session; tests must not leave temp files.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py314"

# Architecture rules (DDD refactor step C1, .agents/PLANS/ddd-refactor/). The rules
# describe the target dependency direction on today's packages; imports that break them
# today are listed under ignore_imports as known exceptions, and each later step may
# only shorten those lists.
[tool.importlinter]
root_package = "cert_prep_backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Platform does not depend on contexts or the web layer"
type = "forbidden"
source_modules = ["cert_prep_backend.platform"]
forbidden_modules = [
  "cert_prep_backend.domains",
  "cert_prep_backend.projects",
  "cert_prep_backend.practice",
  "cert_prep_backend.source_library",
  "cert_prep_backend.api",
  "cert_prep_backend.routers",
]

[[tool.importlinter.contracts]]
name = "Contexts do not depend on the web layer"
type = "forbidden"
# A moved context keeps its own endpoints in <context>.api; its other layers stay free of the web.
source_modules = [
  "cert_prep_backend.domains",
  "cert_prep_backend.projects.infrastructure",
  "cert_prep_backend.practice.domain",
  "cert_prep_backend.practice.application",
  "cert_prep_backend.practice.infrastructure",
  "cert_prep_backend.source_library.domain",
  "cert_prep_backend.source_library.infrastructure",
]
forbidden_modules = [
  "cert_prep_backend.api",
  "cert_prep_backend.routers",
  "fastapi",
  "starlette",
]

[[tool.importlinter.contracts]]
name = "Domain models and policies stay free of frameworks and I/O"
type = "forbidden"
source_modules = [
  "cert_prep_backend.domains.mock_exams.models",
  "cert_prep_backend.domains.mock_exams.ports",
  "cert_prep_backend.domains.mock_exams.deterministic_parser",
  "cert_prep_backend.domains.mock_exams.normalization",
  "cert_prep_backend.source_library.domain",
  "cert_prep_backend.practice.domain",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic",
  "httpx",
  "ollama",
  "capture_runtime_client",
  "cert_prep_backend.platform.database",
  "cert_prep_backend.platform.change_notifications",
  "cert_prep_backend.platform.sse",
  "cert_prep_backend.api",
  "cert_prep_backend.routers",
]

[[tool.importlinter.contracts]]
name = "Study Projects does not depend on other contexts"
type = "forbidden"
source_modules = ["cert_prep_backend.projects"]
forbidden_modules = [
  "cert_prep_backend.source_library",
  "cert_prep_backend.domains.capture_workbench",
  "cert_prep_backend.domains.mock_exams",
  "cert_prep_backend.practice",
  "cert_prep_backend.domains.runtime_installations",
]

[[tool.importlinter.contracts]]
name = "Source Library does not depend on its downstream contexts"
type = "forbidden"
source_modules = ["cert_prep_backend.source_library"]
forbidden_modules = [
  "cert_prep_backend.domains.capture_workbench",
  "cert_prep_backend.domains.mock_exams",
  "cert_prep_backend.practice",
  "cert_prep_backend.domains.runtime_installations",
]

[[tool.importlinter.contracts]]
name = "Question Authoring does not depend on its downstream contexts"
type = "forbidden"
source_modules = ["cert_prep_backend.domains.mock_exams"]
forbidden_modules = [
  "cert_prep_backend.domains.capture_workbench",
  "cert_prep_backend.practice",
  "cert_prep_backend.domains.runtime_installations",
]

[[tool.importlinter.contracts]]
name = "Capture Integration, Practice and Runtime Provisioning do not depend on each other"
type = "independence"
modules = [
  "cert_prep_backend.domains.capture_workbench",
  "cert_prep_backend.practice",
  "cert_prep_backend.domains.runtime_installations",
]
# Known until AI Providers moves (C3) and owns the LLM provider dependency: the practice
# router takes it from api.dependencies, which imports every context.
ignore_imports = [
  "cert_prep_backend.practice.api.router -> cert_prep_backend.api.dependencies",
]

[[tool.importlinter.contracts]]
name = "Each moved context layers api and infrastructure over application over domain"
type = "layers"
# D2: only layers with code exist, so each layer is optional; api and infrastructure do not
# import each other. C3 adds each context here as it moves.
containers = [
  "cert_prep_backend.projects",
  "cert_prep_backend.practice",
  "cert_prep_backend.source_library",
]
layers = ["(api) | (infrastructure)", "(application)", "(domain)"]
# Known before C4, which adds the use cases and the aggregates: the routers call the
# repositories directly, and the projects repository takes the HTTP DTOs.
ignore_imports = [
  "cert_prep_backend.practice.api.router -> cert_prep_backend.practice.infrastructure.repository",
  "cert_prep_backend.projects.api.router -> cert_prep_backend.projects.infrastructure.repository",
  "cert_prep_backend.projects.infrastructure.repository -> cert_prep_backend.projects.api.schemas",
]
