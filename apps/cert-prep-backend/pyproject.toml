[project]
name = "cert-prep-backend"
version = "0.1.0-alpha.1"
description = "Local sidecar API for the cert prep desktop app."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "av>=18.0.0,<19.0.0",
  "capture-contracts",
  "capture-structuring",
  "cert-prep-contracts",
  "cert-prep-ollama",
  "fastapi>=0.124.0,<1.0.0",
  "ollama>=0.6.0,<1.0.0",
  "pillow>=12.0.0,<13.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pypdf>=6.0.0,<7.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[tool.uv.sources]
capture-contracts = { path = "../../../capture-workbench/packages/capture-contracts/python", editable = false }
capture-structuring = { path = "../../../capture-workbench/packages/capture-structuring-python", editable = false }
cert-prep-contracts = { path = "../../packages/cert-prep-contracts", editable = true }
cert-prep-ollama = { path = "../../packages/cert-prep-ollama", editable = true }

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pyinstaller>=6.19.0,<7.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
