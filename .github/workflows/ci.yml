name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
  PYTHON_VERSION: '3.12'

jobs:
  portable-quality:
    name: Portable quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Check out Capture Workbench Python bridge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: gx-capture/capture-workbench
          ref: 206de39b0b85bda1dfd1f17679610c1a740f4911
          path: capture-workbench
          sparse-checkout: |
            packages/capture-runtime-client-python
            packages/capture-structuring-python

      - name: Link Capture Workbench Python bridge (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$GITHUB_WORKSPACE/capture-workbench" "$GITHUB_WORKSPACE/../capture-workbench"

      - name: Link Capture Workbench Python bridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'capture-workbench'
          New-Item -ItemType Junction -Path $target -Target (Join-Path $env:GITHUB_WORKSPACE 'capture-workbench') | Out-Null

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: 0.9.18
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install JavaScript dependencies and pinned Capture Workbench package
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.example
        run: pnpm install --frozen-lockfile

      - name: Sync backend Python environment
        run: uv sync --project apps/cert-prep-backend --python ${{ env.PYTHON_VERSION }} --frozen

      - name: Lint portable projects
        run: >-
          pnpm nx run-many -t lint
          -p cert-prep cert-prep-contracts cert-prep-ollama
          cert-prep-backend
          --parallel=3

      - name: Test portable projects
        run: >-
          pnpm nx run-many -t test
          -p cert-prep cert-prep-contracts cert-prep-ollama
          cert-prep-backend
          --parallel=3

      - name: Build Angular application
        run: pnpm nx run cert-prep:build

      - name: Install Chromium for browser integration
        run: pnpm exec playwright install --with-deps chromium

      - name: Test mocked browser regression
        run: pnpm nx run cert-prep-e2e:e2e --args="--project=chromium --workers=2"

      - name: Test the browser against the real backend
        run: pnpm nx run cert-prep-e2e:e2e-real-backend

  windows-quality:
    name: Windows product quality
    runs-on: windows-2025
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Check out Capture Workbench Python bridge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: gx-capture/capture-workbench
          ref: 206de39b0b85bda1dfd1f17679610c1a740f4911
          path: capture-workbench
          sparse-checkout: |
            packages/capture-runtime-client-python
            packages/capture-structuring-python

      - name: Link Capture Workbench Python bridge (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$GITHUB_WORKSPACE/capture-workbench" "$GITHUB_WORKSPACE/../capture-workbench"

      - name: Link Capture Workbench Python bridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'capture-workbench'
          New-Item -ItemType Junction -Path $target -Target (Join-Path $env:GITHUB_WORKSPACE 'capture-workbench') | Out-Null

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: 0.9.18
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup show active-toolchain

      - name: Verify source Capture Runtime consumer declarations
        run: node --test tools/capture-runtime-version.test.mts

      - name: Install JavaScript dependencies and pinned Capture Workbench package
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.example
        run: pnpm install --frozen-lockfile

      - name: Sync backend Python environment
        run: uv sync --project apps/cert-prep-backend --python ${{ env.PYTHON_VERSION }} --frozen

      - name: Lint Windows-owned Python and Angular projects
        run: >-
          pnpm nx run-many -t lint
          -p cert-prep-contracts cert-prep-ollama
          cert-prep-backend cert-prep
          --parallel=2

      - name: Test Windows-owned Python and Angular projects
        run: >-
          pnpm nx run-many -t test
          -p cert-prep-contracts cert-prep-ollama
          cert-prep-backend cert-prep
          --parallel=2

      - name: Type-check desktop scripts
        run: pnpm nx run cert-prep-desktop:typecheck-scripts

      - name: Test package QA
        run: pnpm nx run cert-prep-desktop:package-qa-test

      - name: Stage the published Capture Runtime release
        run: pnpm nx run cert-prep-desktop:install-capture-runtime --skip-nx-cache

      - name: Verify Capture Runtime installer behavior
        run: node --test tools/install-capture-runtime.test.mts

      - name: Run the Capture Runtime consumer smoke
        run: pnpm nx run cert-prep-desktop:capture-runtime-consumer-smoke --skip-nx-cache

      - name: Verify published Capture registry installation
        if: vars.CAPTURE_PUBLISHED_0_4_0 == 'true'
        env:
          CAPTURE_REQUIRE_PUBLISHED_CAPTURE_ARTIFACTS: '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm nx run cert-prep-desktop:capture-runtime-consumer-test --skip-nx-cache
          uv run --isolated --no-project `
            --with 'capture-runtime-client==0.4.0' `
            --with 'capture-structuring==0.4.0' `
            -- python -c "import capture_runtime_client, capture_structuring; assert capture_runtime_client.CAPTURE_RUNTIME_VERSION == '0.4.0'; assert capture_structuring.__package__ == 'capture_structuring'"

      - name: Test Tauri host
        run: pnpm nx run cert-prep-desktop:cargo-test
